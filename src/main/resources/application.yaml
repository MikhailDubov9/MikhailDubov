server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false

app:
  name: "MIPT Task Manager API"
  version: "2.0.0"

spring:
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.mipt.mikhaildubov.todo: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.mipt.mikhaildubov.todo: ERROR